<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- منع الكاش -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<title>حاسبة الكهرباء والماء</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
body { font-family: Tahoma, Arial; background: #f4f7fb; padding: 15px; margin: 0; }
.card { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 3px 15px rgba(0,0,0,.1); }
h2 { text-align: center; color: #0f766e; margin-bottom: 10px; }

.datetime-bar { text-align: center; background: #f8fafc; border: 1px solid #cbd5e1; padding: 10px; border-radius: 8px; font-size: 14px; color: #475569; margin-bottom: 10px; font-weight: bold; display: flex; flex-direction: column; gap: 5px; }
.owner-name { text-align: center; color: #0f766e; font-weight: bold; margin-bottom: 20px; background: #e0f2fe; padding: 8px; border-radius: 8px; border: 1px dashed #0f766e; }

.total-section { margin-bottom: 20px; }
.btn-total { width: 100%; padding: 15px; font-size: 18px; font-weight: bold; border: none; border-radius: 8px; background: #94a3b8; color: white; cursor: not-allowed; opacity: 0.6; transition: 0.3s; }
.btn-total.active { background: #2563eb; cursor: pointer; opacity: 1; box-shadow: 0 4px 10px rgba(37,99,235,0.3); }
.btn-total.active:hover { background: #1d4ed8; }
.total-result { margin-top: 10px; padding: 20px; background: #f0fdf4; border-radius: 10px; text-align: right; border: 2px solid #86efac; display: none; line-height: 1.8; font-size: 15px;}
.total-result h3 { margin: 0 0 10px 0; color: #166534; text-align: center; border-bottom: 1px solid #bbf7d0; padding-bottom: 10px;}
.total-result .row { display: flex; justify-content: space-between; margin-bottom: 5px; }
.total-result .highlight { font-weight: bold; font-size: 18px; color: #15803d; margin-top: 10px; border-top: 1px dashed #86efac; padding-top: 10px; }

.tabs { display: flex; gap: 10px; margin-bottom: 20px; }
.tab-btn { flex: 1; padding: 12px; border: none; border-radius: 8px; background: #e2e8f0; color: #333; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
.tab-btn.active { background: #0f766e; color: white; }
.tab-content { display: none; }
.tab-content.active { display: block; animation: fadeIn 0.3s; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

label { display: block; margin-top: 15px; font-weight: bold; color: #333; }
input, select, button { width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 16px; transition: 0.3s; }

input.input-error { border: 2px solid #ef4444 !important; background-color: #ffe4e6 !important; }
.error-msg { color: #dc2626; font-size: 14px; margin-top: 5px; display: none; font-weight: bold; }

.btn-calc { background: #0f766e; color: white; border: none; cursor: pointer; margin-top: 20px; font-size: 18px; font-weight: bold; }
.btn-calc:hover { background: #115e59; }
.result { margin-top: 20px; padding: 15px; background: #f8fafc; border-radius: 10px; display: none; line-height: 1.8; border: 1px solid #e2e8f0; }

.report-box { margin-top: 15px; padding: 15px; background: #fff7ed; border: 1px solid #fdba74; border-radius: 8px; display: none; font-size: 15px; line-height: 1.7; color: #333; }
.report-box b { color: #c2410c; }
</style>
</head>
<body>

<div class="card">
<h2>⚡️💧 حاسبة الكهرباء والماء</h2>

<div class="datetime-bar">
    <span id="todayDate"></span>
    <span id="currentTime"></span>
</div>

<div class="owner-name">👤 إعداد: سليمان صالح </div>

<div class="total-section">
    <button id="btnGrandTotal" class="btn-total" onclick="calcGrandTotal()" disabled>
        📊 احسب المقارنة الشاملة (القديم vs الجديد)
    </button>
    <div id="grandTotalResult" class="total-result">
        <h3>📑 التقرير الشامل للفاتورة</h3>
        <div class="row"><span>إجمالي الفاتورة القديمة:</span> <span id="old_grand" style="font-weight:bold;">0.00 ريال</span></div>
        <div class="row"><span>إجمالي الفاتورة الجديدة:</span> <span id="new_grand" style="font-weight:bold; color:#0f766e;">0.00 ريال</span></div>
        <div class="row highlight"><span>الفرق:</span> <span id="diff_grand">0.00 ريال</span></div>
        <div class="row" style="margin-top:5px;"><span>نسبة التغير:</span> <span id="pct_grand" style="font-weight:bold;">0%</span></div>
    </div>
</div>

<div class="tabs">
    <button class="tab-btn active" onclick="openTab('elec')" id="btn-elec">⚡️ الكهرباء</button>
    <button class="tab-btn" onclick="openTab('water')" id="btn-water">💧 الماء</button>
</div>

<div id="elec" class="tab-content active">
    <label>الاستهلاك الشهري (ك.و.س)</label>
    <input type="number" id="e_usage" placeholder="مثال: 500" oninput="clearError('e_usage', 'e_error'); resetOnChange('e')">
    <div id="e_error" class="error-msg">الرجاء إدخال استهلاك الكهرباء أولاً!</div>
    
    <label>سعة القاطع</label>
    <select id="e_breaker" onchange="resetOnChange('e')">
      <option value="70">20-99 أمبير (70 ريال)</option>
      <option value="80">100-199 أمبير (80 ريال)</option>
      <option value="90">200-299 أمبير (90 ريال)</option>
      <option value="100">300+ أمبير (100 ريال)</option>
    </select>
    
    <button class="btn-calc" onclick="calcElec()">احسب الكهرباء</button>
    <div id="e_result" class="result"></div>
    <div id="e_compare" class="report-box"></div>
</div>

<div id="water" class="tab-content">
    <label>استهلاك الماء (متر مكعب) - اختياري</label>
    <input type="number" id="w_usage" placeholder="إذا تركته فارغاً يُحسب صفر" oninput="resetOnChange('w')">
    
    <label>قطر عداد الماء</label>
    <select id="w_meter" onchange="resetOnChange('w')">
      <option value="30">20 ملم أو أقل (30 ريال)</option>
      <option value="60">21-40 ملم (60 ريال)</option>
      <option value="90">41-65 ملم (90 ريال)</option>
      <option value="120">66-100 ملم (120 ريال)</option>
    </select>
    
    <button class="btn-calc" onclick="calcWater()">احسب الماء</button>
    <div id="w_result" class="result"></div>
    <div id="w_compare" class="report-box"></div>
</div>

</div>

<script>
let totals = { elec: { old: 0, new: 0 }, water: { old: 0, new: 0 } };
let calculated = { elec: false, water: false };

// دالة جلب التاريخ الهجري (تقويم أم القرى) رياضياً بدون إنترنت
function getHijriDate(date) {
    let day = date.getDate();
    let month = date.getMonth() + 1;
    let year = date.getFullYear();
    
    let m = month;
    let y = year;
    if (m < 3) { y -= 1; m += 12; }
    let a = Math.floor(y / 100);
    let b = 2 - a + Math.floor(a / 4);
    let jd = Math.floor(365.25 * (y + 4716)) + Math.floor(30.6001 * (m + 1)) + day + b - 1524.5;
    let l = jd - 1948440 + 10632;
    let n = Math.floor((l - 1) / 10631);
    l = l - 10631 * n + 354;
    let j = Math.floor((10985 - l) / 5316) * Math.floor((50 * l) / 17719) + Math.floor(l / 5670) * Math.floor((43 * l) / 15238);
    l = l - Math.floor((30 - j) / 15) * Math.floor((17719 * j) / 50) - Math.floor(j / 16) * Math.floor((15238 * j) / 43) + 29;
    let hijriMonth = Math.floor((24 * l) / 709);
    let hijriDay = Math.floor(l - Math.floor((709 * hijriMonth) / 24) + 0.5); 
    let hijriYear = 30 * n + j - 30;
    
    // تصحيح الفروقات البسيطة لتطابق تقويم أم القرى
    if (hijriDay === 30) { hijriDay = 1; hijriMonth += 1; if(hijriMonth > 12) { hijriMonth = 1; hijriYear += 1; } }
    else { hijriDay += 1; }

    const hijriMonths = ["محرم", "صفر", "ربيع الأول", "ربيع الآخر", "جمادى الأولى", "جمادى الآخرة", "رجب", "شعبان", "رمضان", "شوال", "ذو القعدة", "ذو الحجة"];
    return `${hijriDay} ${hijriMonths[hijriMonth - 1]} ${hijriYear} هـ`;
}

// دالة تحديث الوقت والتاريخ محلياً
function updateDateTime() {
    const now = new Date();
    const days = ["الأحد", "الإثنين", "الثلاثاء", "الأربعاء", "الخميس", "الجمعة", "السبت"];
    let dayName = days[now.getDay()];
    let dateStr = now.toLocaleDateString('ar-EG', { year: 'numeric', month: 'long', day: 'numeric' });
    let hijriDate = getHijriDate(now);
    
    document.getElementById("todayDate").textContent = `${dayName} | ${hijriDate} | ${dateStr} م`;
    
    let hours = now.getHours();
    let minutes = now.getMinutes();
    let seconds = now.getSeconds();
    let ampm = hours >= 12 ? 'مساءً' : 'صباحاً';
    hours = hours % 12; hours = hours ? hours : 12;
    minutes = minutes < 10 ? '0' + minutes : minutes;
    seconds = seconds < 10 ? '0' + seconds : seconds;
    
    document.getElementById("currentTime").textContent = `الوقت: ${hours}:${minutes}:${seconds} ${ampm}`;
}

// تشغيل الساعة عند فتح الصفحة
updateDateTime();
setInterval(updateDateTime, 1000);

function scrollToElement(el) { if (!el) return; setTimeout(() => { window.scrollTo({top: el.getBoundingClientRect().top + window.pageYOffset - 50, behavior: 'smooth'}); }, 150); }
function clearError(id, errId) { document.getElementById(id).classList.remove("input-error"); document.getElementById(errId).style.display = "none"; }
function showError(id, errId) { document.getElementById(id).classList.add("input-error"); document.getElementById(errId).style.display = "block"; document.getElementById(id).focus(); }
function openTab(tabName) { document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active')); document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active')); document.getElementById(tabName).classList.add('active'); document.getElementById('btn-' + tabName).classList.add('active'); }

function resetOnChange(type) {
    if (type === 'e') { calculated.elec = false; totals.elec = { old: 0, new: 0 }; document.getElementById("e_result").style.display = "none"; document.getElementById("e_compare").style.display = "none"; }
    else if (type === 'w') { calculated.water = false; totals.water = { old: 0, new: 0 }; document.getElementById("w_result").style.display = "none"; document.getElementById("w_compare").style.display = "none"; }
    document.getElementById("grandTotalResult").style.display = "none";
    let btn = document.getElementById("btnGrandTotal"); btn.disabled = true; btn.classList.remove("active");
    checkTotals();
}

function checkTotals() {
    let btn = document.getElementById("btnGrandTotal");
    if (calculated.elec && calculated.water) { btn.disabled = false; btn.classList.add("active"); }
    else { btn.disabled = true; btn.classList.remove("active"); }
}

function calcElec() {
    let usage = Number(document.getElementById("e_usage").value);
    let fixed = Number(document.getElementById("e_breaker").value);
    if(!usage || usage <= 0){ showError('e_usage', 'e_error'); return; }
    
    let energyCost = (Math.min(usage, 6000) * 0.21) + (Math.max(usage - 6000, 0) * 0.33);
    let subtotal = energyCost + fixed;
    let vat = subtotal * 0.15;
    totals.elec.new = subtotal + vat;
    calculated.elec = true;

    let resultDiv = document.getElementById("e_result");
    resultDiv.innerHTML = `
    <b>الاستهلاك:</b> ${energyCost.toFixed(2)} ريال<br>
    <b>الثابتة:</b> ${fixed.toFixed(2)} ريال<br>
    <b>الضريبة (15%):</b> ${vat.toFixed(2)} ريال<br>
    <hr><b style="color:#0f766e; font-size:18px;">إجمالي الكهرباء (جديد): ${totals.elec.new.toFixed(2)} ريال</b>`;
    resultDiv.style.display = "block";
    
    let compareDiv = document.getElementById("e_compare");
    let oldEnergyCost = (Math.min(usage, 6000) * 0.18) + (Math.max(usage - 6000, 0) * 0.30);
    totals.elec.old = (oldEnergyCost + 10) * 1.15;
    
    let diff = Math.abs(totals.elec.new - totals.elec.old);
    let pct = (diff / totals.elec.old) * 100;
    let status = totals.elec.new > totals.elec.old ? "زيادة" : "انخفاض";
    
    compareDiv.innerHTML = `
    <b>📝 تقرير المقارنة (كهرباء):</b><br>
    • الفاتورة القديمة: <b>${totals.elec.old.toFixed(2)} ريال</b><br>
    • الفاتورة الجديدة: <b>${totals.elec.new.toFixed(2)} ريال</b><br>
    • الفرق: <b>${diff.toFixed(2)} ريال</b> (${status})<br>
    • نسبة التغير: <b>${pct.toFixed(1)}%</b>`;
    compareDiv.style.display = "block";
    
    scrollToElement(resultDiv);
    checkTotals();
}

function calcWater() {
    let usage = Number(document.getElementById("w_usage").value) || 0;
    let fixed = Number(document.getElementById("w_meter").value);

    let t1 = Math.min(usage, 15), t2 = Math.max(Math.min(usage - 15, 15), 0), t3 = Math.max(Math.min(usage - 30, 15), 0), t4 = Math.max(usage - 45, 0);
    let waterCost = (t1 * 1.5) + (t2 * 3) + (t3 * 6) + (t4 * 9);
    
    let subtotal = waterCost + fixed;
    let vat = subtotal * 0.15;
    totals.water.new = subtotal + vat;
    calculated.water = true;

    let resultDiv = document.getElementById("w_result");
    resultDiv.innerHTML = `
    <b>الماء:</b> ${waterCost.toFixed(2)} ريال<br>
    <b>الثابتة:</b> ${fixed.toFixed(2)} ريال<br>
    <b>الضريبة (15%):</b> ${vat.toFixed(2)} ريال<br>
    <hr><b style="color:#0f766e; font-size:18px;">إجمالي الماء (جديد): ${totals.water.new.toFixed(2)} ريال</b>`;
    resultDiv.style.display = "block";
    
    let compareDiv = document.getElementById("w_compare");
    let oldWaterCost = (t1 * 0.15) + (t2 * 1.5) + (t3 * 6) + (t4 * 9);
    totals.water.old = (oldWaterCost + 10) * 1.15;
    
    let diff = Math.abs(totals.water.new - totals.water.old);
    let pct = (diff / totals.water.old) * 100;
    let status = totals.water.new > totals.water.old ? "زيادة" : "انخفاض";

    compareDiv.innerHTML = `
    <b>📝 تقرير المقارنة (ماء):</b><br>
    • الفاتورة القديمة: <b>${totals.water.old.toFixed(2)} ريال</b><br>
    • الفاتورة الجديدة: <b>${totals.water.new.toFixed(2)} ريال</b><br>
    • الفرق: <b>${diff.toFixed(2)} ريال</b> (${status})<br>
    • نسبة التغير: <b>${pct.toFixed(1)}%</b>`;
    compareDiv.style.display = "block";

    scrollToElement(resultDiv);
    checkTotals();
}

function calcGrandTotal() {
    let oldGrand = totals.elec.old + totals.water.old;
    let newGrand = totals.elec.new + totals.water.new;
    let diff = Math.abs(newGrand - oldGrand);
    let pct = oldGrand > 0 ? (diff / oldGrand) * 100 : 0;
    let status = newGrand > oldGrand ? "زيادة" : "انخفاض";

    document.getElementById("old_grand").textContent = oldGrand.toFixed(2) + " ريال";
    document.getElementById("new_grand").textContent = newGrand.toFixed(2) + " ريال";
    document.getElementById("diff_grand").textContent = diff.toFixed(2) + " ريال (" + status + ")";
    document.getElementById("pct_grand").textContent = pct.toFixed(1) + "%";

    let resultDiv = document.getElementById("grandTotalResult");
    resultDiv.style.display = "block";
    scrollToElement(resultDiv);
}
</script>

</body>
</html>
