<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حاسبة الكهرباء والماء</title>
<style>
body { font-family: Tahoma, Arial; background: #f4f7fb; padding: 15px; margin: 0; }
.card { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 3px 15px rgba(0,0,0,.1); }
h2 { text-align: center; color: #0f766e; margin-bottom: 20px; }

.tabs { display: flex; gap: 10px; margin-bottom: 20px; }
.tab-btn { flex: 1; padding: 12px; border: none; border-radius: 8px; background: #e2e8f0; color: #333; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
.tab-btn.active { background: #0f766e; color: white; }

.tab-content { display: none; }
.tab-content.active { display: block; animation: fadeIn 0.3s; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

label { display: block; margin-top: 15px; font-weight: bold; color: #333; }
input, select, button { width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
.btn-calc { background: #0f766e; color: white; border: none; cursor: pointer; margin-top: 20px; font-size: 18px; font-weight: bold; transition: 0.3s; }
.btn-calc:hover { background: #115e59; }

.result { margin-top: 20px; padding: 15px; background: #f8fafc; border-radius: 10px; display: none; line-height: 1.8; border: 1px solid #e2e8f0; }
.chart { display: flex; align-items: flex-end; gap: 20px; height: 180px; margin-top: 20px; display: none; }
.bar-wrap { flex: 1; text-align: center; }
.bar { width: 100%; border-radius: 10px 10px 0 0; color: white; font-weight: bold; display: flex; justify-content: center; align-items: flex-start; padding-top: 5px; box-sizing: border-box; }
.old { background: #3b82f6; } .new { background: #10b981; }
</style>
</head>
<body>

<div class="card">
<h2>⚡️💧 حاسبة الفواتير</h2>

<div class="tabs">
    <button class="tab-btn active" onclick="openTab('elec')" id="btn-elec">⚡️ الكهرباء</button>
    <button class="tab-btn" onclick="openTab('water')" id="btn-water">💧 الماء</button>
</div>

<!-- تبويب الكهرباء -->
<div id="elec" class="tab-content active">
    
    <label>نوع القطاع (التعريفة)</label>
    <select id="e_sector" onchange="updateBreakerOptions()">
      <option value="residential">سكني (منازل)</option>
      <option value="commercial">تجاري / تعليمي / صحي أهلي</option>
    </select>

    <label>الاستهلاك الشهري للكهرباء (ك.و.س)</label>
    <input type="number" id="e_usage" placeholder="مثال: 3500">
    
    <label>سعة القاطع (الكهرباء)</label>
    <select id="e_breaker">
      <!-- سيتم تعبئتها تلقائياً حسب القطاع -->
    </select>

    <label>مبلغ فاتورة الكهرباء للشهر الماضي (اختياري)</label>
    <input type="number" id="e_oldBill" placeholder="مثال: 500">
    
    <button class="btn-calc" onclick="calcElec()">احسب الكهرباء</button>
    <div id="e_result" class="result"></div>
    <div id="e_chart" class="chart">
        <div class="bar-wrap"><div id="e_oldBar" class="bar old"></div><div>الماضي</div></div>
        <div class="bar-wrap"><div id="e_newBar" class="bar new"></div><div>الجديد</div></div>
    </div>
</div>

<!-- تبويب الماء -->
<div id="water" class="tab-content">
    <label>استهلاك الماء (متر مكعب)</label>
    <input type="number" id="w_usage" placeholder="مثال: 25">
    
    <label>قطر عداد الماء</label>
    <select id="w_meter">
      <option value="20">20 ملم أو أقل (رسوم ثابتة 30 ريال)</option>
      <option value="40">21 - 40 ملم (رسوم ثابتة 60 ريال)</option>
      <option value="60">41 - 65 ملم (رسوم ثابتة 90 ريال)</option>
      <option value="80">66 - 100 ملم (رسوم ثابتة 120 ريال)</option>
      <option value="100">أكثر من 100 ملم (رسوم ثابتة 150 ريال)</option>
    </select>

    <label>مبلغ فاتورة الماء للشهر الماضي (اختياري)</label>
    <input type="number" id="w_oldBill" placeholder="مثال: 150">
    
    <button class="btn-calc" onclick="calcWater()">احسب الماء</button>
    <div id="w_result" class="result"></div>
    <div id="w_chart" class="chart">
        <div class="bar-wrap"><div id="w_oldBar" class="bar old"></div><div>الماضي</div></div>
        <div class="bar-wrap"><div id="w_newBar" class="bar new"></div><div>الجديد</div></div>
    </div>
</div>

</div>

<script>
// 1. تحديث خيارات القاطع بناءً على القطاع
function updateBreakerOptions() {
    let sector = document.getElementById("e_sector").value;
    let breakerSelect = document.getElementById("e_breaker");
    
    if (sector === "residential") {
        breakerSelect.innerHTML = `
            <option value="70">20 - أقل من 100 أمبير (70 ريال)</option>
            <option value="80">100 - أقل من 200 أمبير (80 ريال)</option>
            <option value="90">200 - أقل من 300 أمبير (90 ريال)</option>
            <option value="100">300 أمبير فأكثر (100 ريال)</option>
        `;
    } else {
        breakerSelect.innerHTML = `
            <option value="350">20 - أقل من 100 أمبير (350 ريال)</option>
            <option value="500">100 - أقل من 200 أمبير (500 ريال)</option>
            <option value="700">200 - أقل من 300 أمبير (700 ريال)</option>
            <option value="900">300 أمبير فأكثر (900 ريال)</option>
        `;
    }
}

// تشغيل الدالة عند فتح الصفحة
window.onload = function() {
    updateBreakerOptions();
};

function openTab(tabName) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
    document.getElementById(tabName).classList.add('active');
    document.getElementById('btn-' + tabName).classList.add('active');
}

// 2. حساب الكهرباء
function calcElec() {
    let sector = document.getElementById("e_sector").value;
    let usage = Number(document.getElementById("e_usage").value);
    let fixed = Number(document.getElementById("e_breaker").value);
    let oldBill = Number(document.getElementById("e_oldBill").value);

    if(!usage || usage <= 0){ alert("الرجاء إدخال استهلاك الكهرباء"); return; }

    let rate1, rate2;
    if (sector === "residential") {
        rate1 = 0.21; // 21 هللة
        rate2 = 0.33; // 33 هللة
    } else {
        rate1 = 0.25; // 25 هللة
        rate2 = 0.35; // 35 هللة
    }

    let tier1 = Math.min(usage, 6000);
    let tier2 = Math.max(usage - 6000, 0);
    let energyCost = (tier1 * rate1) + (tier2 * rate2);
    
    let subtotal = energyCost + fixed;
    let vat = subtotal * 0.15;
    let total = subtotal + vat;

    let sectorName = sector === "residential" ? "سكني" : "تجاري/تعليمي";

    let html = `
    <b>نوع التعريفة:</b> ${sectorName}<br>
    <b>رسوم الاستهلاك:</b> ${energyCost.toFixed(2)} ريال<br>
    <b>الرسوم الثابتة:</b> ${fixed.toFixed(2)} ريال<br>
    <b>الضريبة (15%):</b> ${vat.toFixed(2)} ريال<br>
    <hr style="border:1px solid #ddd;">
    <b style="font-size:18px; color:#0f766e;">إجمالي الكهرباء: ${total.toFixed(2)} ريال</b>
    `;

    if(oldBill > 0) {
        let diff = total - oldBill;
        let pct = (diff / oldBill) * 100;
        let status = diff > 0 ? "زيادة" : "انخفاض";
        html += `<hr style="border:1px solid #ddd;">
        <b>فاتورة الشهر الماضي:</b> ${oldBill.toFixed(2)} ريال<br>
        <b>الفرق:</b> ${Math.abs(diff).toFixed(2)} ريال (${status})<br>
        <b>النسبة:</b> ${Math.abs(pct).toFixed(2)}%`;
        drawChart('e_oldBar', 'e_newBar', 'e_chart', oldBill, total);
    } else { document.getElementById('e_chart').style.display = 'none'; }

    document.getElementById("e_result").innerHTML = html;
    document.getElementById("e_result").style.display = "block";
}

// 3. حساب الماء
function calcWater() {
    let usage = Number(document.getElementById("w_usage").value) || 0;
    let meter = Number(document.getElementById("w_meter").value);
    let oldBill = Number(document.getElementById("w_oldBill").value);

    let t1 = Math.min(usage, 15);
    let t2 = Math.max(Math.min(usage - 15, 15), 0);
    let t3 = Math.max(Math.min(usage - 30, 15), 0);
    let t4 = Math.max(usage - 45, 0);
    
    let waterCost = (t1 * 1) + (t2 * 2) + (t3 * 4) + (t4 * 6);
    let sewageCost = waterCost * 0.5;
    
    let fixed = 0;
    if(meter == 20) fixed = 20 + 10;
    else if(meter == 40) fixed = 40 + 20;
    else if(meter == 60) fixed = 60 + 30;
    else if(meter == 80) fixed = 80 + 40;
    else fixed = 100 + 50;

    let subtotal = waterCost + sewageCost + fixed;
    let vat = subtotal * 0.15;
    let total = subtotal + vat;

    let html = `
    <b>استهلاك الماء:</b> ${waterCost.toFixed(2)} ريال<br>
    <b>الصرف الصحي (50%):</b> ${sewageCost.toFixed(2)} ريال<br>
    <b>الرسوم الثابتة:</b> ${fixed.toFixed(2)} ريال<br>
    <b>الضريبة (15%):</b> ${vat.toFixed(2)} ريال<br>
    <hr style="border:1px solid #ddd;">
    <b style="font-size:18px; color:#0f766e;">إجمالي الماء: ${total.toFixed(2)} ريال</b>
    `;

    if(oldBill > 0) {
        let diff = total - oldBill;
        let pct = (diff / oldBill) * 100;
        let status = diff > 0 ? "زيادة" : "انخفاض";
        html += `<hr style="border:1px solid #ddd;">
        <b>فاتورة الشهر الماضي:</b> ${oldBill.toFixed(2)} ريال<br>
        <b>الفرق:</b> ${Math.abs(diff).toFixed(2)} ريال (${status})<br>
        <b>النسبة:</b> ${Math.abs(pct).toFixed(2)}%`;
        drawChart('w_oldBar', 'w_newBar', 'w_chart', oldBill, total);
    } else { document.getElementById('w_chart').style.display = 'none'; }

    document.getElementById("w_result").innerHTML = html;
    document.getElementById("w_result").style.display = "block";
}

function drawChart(oldId, newId, chartId, oldVal, newVal){
    document.getElementById(chartId).style.display="flex";
    let max = Math.max(oldVal, newVal);
    document.getElementById(oldId).style.height = ((oldVal/max)*150) + "px";
    document.getElementById(newId).style.height = ((newVal/max)*150) + "px";
    document.getElementById(oldId).textContent = oldVal.toFixed(0);
    document.getElementById(newId).textContent = newVal.toFixed(0);
}
</script>

</body>
</html>
