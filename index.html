<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حاسبة الكهرباء الدقيقة</title>
<style>
body { font-family: Tahoma, Arial; background: #f4f7fb; padding: 15px; margin: 0; }
.card { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 3px 15px rgba(0,0,0,.1); }
h2 { text-align: center; color: #0f766e; margin-bottom: 10px; }

/* تنسيق شريط التاريخ والوقت */
.datetime-bar {
    text-align: center;
    background: #f8fafc;
    border: 1px solid #cbd5e1;
    padding: 10px;
    border-radius: 8px;
    font-size: 14px;
    color: #475569;
    margin-bottom: 10px;
    font-weight: bold;
    display: flex;
    flex-direction: column;
    gap: 5px;
}
.datetime-bar span { display: block; }

/* تنسيق اسمك */
.owner-name { text-align: center; color: #0f766e; font-weight: bold; margin-bottom: 20px; background: #e0f2fe; padding: 8px; border-radius: 8px; border: 1px dashed #0f766e; }

label { display: block; margin-top: 15px; font-weight: bold; color: #333; }
input, select, button { width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
input.input-error { border: 2px solid #ef4444 !important; background-color: #ffe4e6 !important; }
.error-msg { color: #dc2626; font-size: 14px; margin-top: 5px; display: none; font-weight: bold; }
.btn-calc { background: #0f766e; color: white; border: none; cursor: pointer; margin-top: 20px; font-size: 18px; font-weight: bold; }
.btn-calc:hover { background: #115e59; }
.result { margin-top: 20px; padding: 15px; background: #f8fafc; border-radius: 10px; display: none; line-height: 1.8; border: 1px solid #e2e8f0; }
.result b { color: #0f766e; }
</style>
</head>
<body>

<div class="card">
<h2>⚡️ حاسبة الكهرباء</h2>

<!-- شريط التاريخ والوقت -->
<div class="datetime-bar">
    <span id="todayDate"></span>
    <span id="currentTime"></span>
</div>

<!-- اسمك -->
<div class="owner-name">👤 إعداد: سليمان صالح الصهيل</div>

<label>الاستهلاك الشهري (ك.و.س)</label>
<input type="number" id="usage" placeholder="مثال: 500" oninput="clearError()">
<div id="error" class="error-msg">الرجاء إدخال استهلاك صحيح!</div>

<label>سعة القاطع</label>
<select id="breaker">
  <option value="70">20-99 أمبير (70 ريال)</option>
  <option value="80">100-199 أمبير (80 ريال)</option>
  <option value="90">200-299 أمبير (90 ريال)</option>
  <option value="100">300+ أمبير (100 ريال)</option>
</select>

<button class="btn-calc" onclick="calculate()">احسب</button>
<div id="result" class="result"></div>

</div>

<script>
// دالة تحديث الوقت والتاريخ (طريقة يدوية مضمونة للجميع)
function updateDateTime() {
    const now = new Date();
    
    // أيام الأسبوع بالعربي
    const days = ["الأحد", "الإثنين", "الثلاثاء", "الأربعاء", "الخميس", "الجمعة", "السبت"];
    let dayName = days[now.getDay()];
    
    // التاريخ الميلادي (يوم/شهر/سنة)
    let dateStr = now.toLocaleDateString('ar-EG', { year: 'numeric', month: 'long', day: 'numeric' });
    
    // التاريخ الهجري
    let hijriDate = "";
    try {
        hijriDate = now.toLocaleDateString('ar-SA', { year: 'numeric', month: 'long', day: 'numeric' });
    } catch(e) {
        hijriDate = "التقويم الهجري";
    }

    // عرض اليوم والتاريخ
    document.getElementById("todayDate").textContent = `${dayName} | ${hijriDate} هـ | ${dateStr} م`;
    
    // الوقت (الساعة:الدقيقة:الثانية ص/م)
    let hours = now.getHours();
    let minutes = now.getMinutes();
    let seconds = now.getSeconds();
    let ampm = hours >= 12 ? 'مساءً' : 'صباحاً';
    
    hours = hours % 12;
    hours = hours ? hours : 12; // الساعة 0 تصير 12
    minutes = minutes < 10 ? '0' + minutes : minutes;
    seconds = seconds < 10 ? '0' + seconds : seconds;
    
    document.getElementById("currentTime").textContent = `الوقت: ${hours}:${minutes}:${seconds} ${ampm}`;
}

// تشغيل التحديث عند فتح الصفحة
updateDateTime();
// تحديث الوقت كل ثانية
setInterval(updateDateTime, 1000);


function clearError() {
    document.getElementById("usage").classList.remove("input-error");
    document.getElementById("error").style.display = "none";
}

function calculate() {
    let usage = Number(document.getElementById("usage").value);
    let fixed = Number(document.getElementById("breaker").value);
    
    if (!usage || usage <= 0) {
        document.getElementById("usage").classList.add("input-error");
        document.getElementById("error").style.display = "block";
        return;
    }

    // 1. حساب الشرائح (سكني)
    let tier1 = Math.min(usage, 6000); 
    let tier2 = Math.max(usage - 6000, 0); 

    let costT1 = tier1 * 0.21;
    let costT2 = tier2 * 0.33;
    let totalEnergy = costT1 + costT2;

    // 2. الحساب النهائي
    let subtotal = totalEnergy + fixed;
    let vat = subtotal * 0.15;
    let total = subtotal + vat;

    let resultDiv = document.getElementById("result");
    resultDiv.innerHTML = `
    <b>تفاصيل الحساب:</b><br>
    - الشريحة الأولى (حتى 6000): ${tier1} × 21 هللة = ${costT1.toFixed(2)} ريال<br>
    ${tier2 > 0 ? `- الشريحة الثانية (فوق 6000): ${tier2} × 33 هللة = ${costT2.toFixed(2)} ريال<br>` : ''}
    - الرسوم الثابتة: ${fixed.toFixed(2)} ريال<br>
    - الضريبة (15%): ${vat.toFixed(2)} ريال<br>
    <hr style="border:0; border-top:1px solid #ddd; margin:10px 0;">
    <b style="font-size:20px;">الإجمالي النهائي: ${total.toFixed(2)} ريال</b>
    `;
    resultDiv.style.display = "block";

    setTimeout(() => {
        resultDiv.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }, 100);
}
</script>

</body>
</html>
